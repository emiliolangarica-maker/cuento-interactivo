<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuento interactivo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="story-screen" id="story-screen">
      <div class="story-card">
        <p class="scene-tag" id="scene-tag">Escena 1</p>
        <h1 id="story-title">Título de la escena</h1>
        <p id="story-text">
          lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.
        </p>
        <button id="next-button" type="button">Siguiente escena</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>

<!--
Explicación rápida del HTML:
- <!DOCTYPE html> indica que el documento es HTML5.
- <html lang="es"> abre el documento y define el idioma español.
- <head> contiene metadatos y enlaces a archivos externos.
- <meta charset="UTF-8"> asegura que los caracteres especiales se muestren bien.
- <meta name="viewport"> adapta la página a móviles y pantallas pequeñas.
- <title> pone el nombre que aparece en la pestaña del navegador.
- <link rel="stylesheet" href="style.css"> conecta la hoja de estilos CSS.
- <body> contiene todo lo que se ve en la web.
- <main class="story-screen" id="story-screen"> crea la pantalla principal del cuento.
- <div class="story-card"> es un contenedor visual para el texto y el botón.
- <p class="scene-tag" id="scene-tag"> muestra el número o nombre de la escena.
- <h1 id="story-title"> es el título principal de la historia.
- <p id="story-text"> contiene el texto narrativo.
- <button id="next-button" type="button"> es el botón para avanzar a la siguiente escena.
- <script src="script.js"></script> conecta el archivo JavaScript a la página.
-->
